<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FitID</title>
  <link rel="stylesheet" href="../ui/shared.css">
  <style>
    body { width: 380px; }
    .wrap { padding: 14px; }
    .head { display: flex; align-items: center; justify-content: space-between; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 0 8px; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .tabs { display: flex; gap: 4px; margin-top: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 13px; padding: 7px; border-radius: 8px; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }
    .empty { text-align: center; padding: 18px 6px 8px; }
    .empty h1 { font-size: 20px; margin: 8px 0 6px; }
    .empty p { color: var(--muted); margin: 0 0 14px; }
    .brands { display: flex; flex-direction: column; gap: 6px; }
    .b { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; text-decoration: none; color: inherit; }
    .b:hover { border-color: var(--muted); }
    .b .sz { min-width: 40px; height: 40px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 800; }
    .b .nm { font-weight: 700; }
    .b .sub { font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions .btn { flex: 1; }
    .small { font-size: 12px; color: var(--muted); }
    .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
    /* converter */
    .seg { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .seg button { border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .pick { display: flex; gap: 8px; margin-top: 12px; }
    .pick label { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    select { font: inherit; font-size: 14px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-transform: none; letter-spacing: 0; }
    .result { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
    .result .tile { padding: 8px 10px; }
    .result .t-big { font-size: 18px; }
    .measure { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .tbl-wrap { margin-top: 12px; max-height: 210px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 5px 6px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--surface-2); font-weight: 700; color: var(--muted); }
    tr.sel td { background: var(--accent); color: var(--accent-text); font-weight: 700; }
    tr { cursor: pointer; }
    .you { font-size: 10px; font-weight: 800; background: #16a34a; color: #fff; border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brandmark"><span class="logo">F</span> FitID</div>
      <button class="btn ghost" id="edit" style="padding:6px 10px;font-size:12px">Edit profile</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-sizes" aria-selected="true">My sizes</button>
      <button role="tab" id="tab-conv" aria-selected="false">Converter</button>
    </div>
    <div id="content"></div>
    <div id="converter" hidden></div>
  </div>
  <script src="../lib/units.js"></script>
  <script src="../lib/standards.js"></script>
  <script src="../lib/engine.js"></script>
  <script src="../lib/profile.js"></script>
  <script src="../lib/summary-view.js"></script>
  <script src="../lib/converter.js"></script>
  <script src="../lib/brands.js"></script>
  <script src="popup.js"></script>
  <script src="converter-view.js"></script>
</body>
</html>
